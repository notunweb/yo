<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DonutNews — Flood vs Drain Wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --flood: #2F6FED;
    --drain: #57E37A;
    --amber: #FFB020;
    --text: #EDEFF5;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    position: relative;

    /* ---- YOUR BACKGROUND PHOTO GOES HERE ----
       Put an image file named "background.jpg" in the same folder
       as this HTML file, and it'll show automatically.
       Want a different filename? Just change "background.jpg" below. */
    background:
      url('background.png') center / cover no-repeat,
      radial-gradient(circle at 50% 30%, #1a2130, #05070A 70%);
  }

  /* Dark scrim so the wheel stays readable over any photo */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(5, 7, 10, 0.45);
    z-index: 0;
  }

  .wheel-zone {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .pointer {
    width: 0; height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-top: 18px solid var(--amber);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    margin-bottom: -6px;
  }

  .wheel {
    position: relative;
    width: min(520px, 90vw);
    height: min(5200px, 90vw);
    border-radius: 50%;
    background: conic-gradient(from 0deg,
      var(--flood) 0deg 180deg,
      var(--drain) 180deg 360deg);
    border: 5px solid #05070A;
    box-shadow: 0 0 0 2px rgba(237,239,245,0.12), 0 20px 50px rgba(0,0,0,0.55);
    transform: rotate(0deg);
    cursor: pointer;
    transition: filter 0.15s ease;
  }

  .wheel:hover { filter: brightness(1.05); }
  .wheel:active { filter: brightness(0.97); }

  .wheel-label {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 130px;
    margin-left: -65px;
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 24px;
    letter-spacing: 0.03em;
    color: rgba(255,255,255,0.95);
    text-shadow: 0 1px 3px rgba(0,0,0,0.45);
    transform: rotate(calc(var(--i) * 180deg + 90deg)) translateY(-96px) rotate(calc(-1 * (var(--i) * 180deg + 90deg)));
    pointer-events: none;
  }

  .wheel-hub {
    position: absolute;
    top: 50%; left: 50%;
    width: 76px; height: 76px;
    margin: -38px 0 0 -38px;
    border-radius: 50%;
    background: #05070A;
    border: 3px solid var(--amber);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.05em;
    color: var(--amber);
    z-index: 2;
    pointer-events: none;
  }

  .result-flash {
    font-family: 'Teko', sans-serif;
    font-weight: 700;
    font-size: 44px;
    letter-spacing: 0.03em;
    height: 54px;
    opacity: 0;
    transform: translateY(6px) scale(0.9);
  }

  .result-flash.show {
    animation: flashIn 1.6s ease forwards;
  }

  @keyframes flashIn {
    0% { opacity: 0; transform: translateY(6px) scale(0.85); }
    15% { opacity: 1; transform: translateY(0) scale(1.08); }
    28% { transform: translateY(0) scale(1); }
    82% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-6px) scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .wheel { transition-duration: 0.6s !important; }
    .result-flash.show { animation-duration: 0.7s; }
  }
</style>
</head>
<body>

<div class="wheel-zone">
  <div class="pointer"></div>
  <div class="wheel" id="wheel">
    <div class="wheel-label" style="--i:0">FLOOD</div>
    <div class="wheel-label" style="--i:1">DRAIN</div>
    <div class="wheel-hub">SPIN</div>
  </div>
  <div class="result-flash" id="resultFlash"></div>
</div>

<script>
(function(){
  const segments = ['flood', 'drain'];
  const colors = { flood: 'var(--flood)', drain: 'var(--drain)' };

  let spinning = false;
  let currentRotation = 0;

  const wheel = document.getElementById('wheel');
  const resultFlash = document.getElementById('resultFlash');

  function spin(){
    if (spinning) return;
    spinning = true;

    const idx = Math.floor(Math.random() * segments.length);
    const segCenter = idx * 180 + 90;
    const extraSpins = 6;
    const targetMod = (360 - segCenter) % 360;
    const current = ((currentRotation % 360) + 360) % 360;
    let delta = targetMod - current;
    if (delta < 0) delta += 360;
    currentRotation = currentRotation + extraSpins * 360 + delta;

    wheel.style.transition = 'transform 4.2s cubic-bezier(0.12,0.72,0.13,1)';
    wheel.style.transform = 'rotate(' + currentRotation + 'deg)';

    setTimeout(function(){
      const winner = segments[idx];
      resultFlash.classList.remove('show');
      void resultFlash.offsetWidth; // restart animation
      resultFlash.textContent = winner.toUpperCase();
      resultFlash.style.color = colors[winner];
      resultFlash.classList.add('show');
      spinning = false;
    }, 4300);
  }

  wheel.addEventListener('click', spin);
})();
</script>

</body>
</html>
